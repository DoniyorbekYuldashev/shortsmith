[project]
name = "shortsmith"
version = "0.1.0"
description = "AI agents that turn one line of text into a finished 30-second vertical short video."
readme = "README.md"
authors = [
    { name = "Doniyor Yuldashev", email = "doniyojon.yuldashev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "fal-client>=1.0.3",
    "openai>=3.33.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "tiktoken>=0.14.0",
]

[project.scripts]
shortsmith = "shortsmith:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]  # exercises/ hold unfinished copies: run them with `uv run pytest exercises/phase-2`

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
