[project]
name = "shortsmith"
version = "0.1.0"
description = "AI agents that turn one line of text into a finished 30-second vertical short video."
readme = "README.md"
authors = [
    { name = "Doniyor Yuldashev", email = "doniyojon.yuldashev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "edge-tts>=7.3.1",
    "fal-client>=1.0.3",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp[cli]>=2.3.0",
    "mlflow>=3.17.2",
    "openai>=3.33.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
    "tzdata>=2026.5",
]

[project.scripts]
shortsmith = "shortsmith.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]  # exercises/ hold unfinished copies: run them with `uv run pytest exercises/phase-2`

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# Windows Smart App Control on this machine blocks some freshly published native wheels
# ("An Application Control policy has blocked this file"): pin versions whose DLLs load (Phase 6 build notes, E1).
constraint-dependencies = ["uuid-utils==0.12.0", "pandas==2.3.3", "sqlalchemy<2.1"]
